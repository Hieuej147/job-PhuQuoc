[project]
name = "phuquoc-jobs-agent"
version = "0.1.0"
description = "AI Agent for Phú Quốc Jobs"
requires-python = ">=3.11"
dependencies = [
    "copilotkit>=0.1.74",
    "ag-ui-langgraph>=0.0.22",
    "langchain>=1.0.1",
    "langchain-openai>=1.0.1",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph>=1.0.1",
    "fastapi>=0.115.12",
    "uvicorn>=0.38.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "tools", "schemas", "routers", "core"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.30",
]
